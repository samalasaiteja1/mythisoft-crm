# nixpacks.toml for the backend service (mythisoft-crm)
#
# This file is used when a deployment service's rootDirectory is set to
# /server. It overrides Railpack's monorepo auto-detection so the service
# only installs and builds within this directory, and starts the Express
# API directly.

[phases.install]
cmds = []

[phases.build]
cmds = ["npm install", "npm run build"]

[start]
cmd = "node server.js"
